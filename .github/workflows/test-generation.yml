name: Test Generation

on:
  schedule:
    # Weekdays at 06:00 UTC. GitHub Actions cron is UTC.
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Work the In Progress backlog
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          agent -p --force --trust --output-format text "$(cat <<'EOF'
          Work the "In Progress" backlog. This workflow started you; do not start another run.

          Queue: DS tickets in status "In Progress" that do not already have the tests-generated label.
          Budget: at most 5 tickets. Process them in key order.

          Per ticket: analyze the ticket, write a conforming Playwright spec under tests/, run it with npx playwright test, and triage a red run. Open one PR linked to the ticket. After the PR exists, add the tests-generated label so the next run skips it.

          Stop on a repeated identical failure and move on. Leave the ticket unlabeled when no PR was opened.
          Never merge a PR. Never close a ticket.
          EOF
          )"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn
