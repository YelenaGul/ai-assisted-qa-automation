name: Test Generation

on:
  schedule:
    # Weekdays at 06:00 UTC. GitHub Actions cron is UTC.
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Work the In Progress backlog
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_TOKEN }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          agent -p --force --trust --output-format text "$(cat <<'EOF'
          Work the "In Progress" backlog, then CI self-heal. This workflow started you; do not start another run.
          Follow .cursor/rules/qa-orchestrator.mdc (Backlog mode + Heal on red) and .cursor/skills/self-heal/SKILL.md.

          ## Backlog
          Queue: DS tickets in status "In Progress" that do not already have the tests-generated label.
          Budget: at most 5 tickets. Process them in key order.

          Per ticket: analyze the ticket, write a conforming Playwright spec under tests/, run it with npx playwright test.
          On red: triage first. If drift (test issue) → apply self-heal (Agent-Browser a11y rediscovery, POM locator patch only, re-run proving green with assertions unchanged), then open a repair PR linked to this Actions run. If real app bug → bug-reporter path only; never heal a bug.
          Open one ticket PR linked to the ticket. After that PR exists, add the tests-generated label so the next run skips it.
          Stop on a repeated identical failure and move on. Leave the ticket unlabeled when no PR was opened.

          ## CI self-heal (always — even when the backlog queue is empty)
          After backlog work (or immediately if the queue is empty), run: npx playwright test
          If the suite is red: triage → if drift, apply self-heal like a ProgramsPage locator repair PR (rediscover via Agent-Browser, patch pages/ POM only, prove green with assertions unchanged, open one repair PR per heal linked to this Actions run URL).
          Heal budget: at most 5 heals per run. Never heal or weaken assertions. Never heal a real app bug. Never merge a PR. Never close a ticket.
          EOF
          )"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn
